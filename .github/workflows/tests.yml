name: Tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: "5.5"
            composer: "2.2"
            tests: false
          - php-version: "7.4"
            composer: latest
            tests: true
          - php-version: "8.5"
            composer: latest
            tests: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:${{ matrix.composer }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install runtime dependencies on the minimum PHP version
        if: matrix.tests == false
        run: composer update --no-dev --prefer-stable --no-interaction

      - name: Lint runtime source on the minimum PHP version
        if: matrix.tests == false
        run: find Factories Objects -type f -name '*.php' -print0 | xargs -0 -n 1 php -l

      - name: Install development dependencies
        if: matrix.tests == true
        run: composer install --no-interaction --prefer-dist

      - name: Run test suite
        if: matrix.tests == true
        run: composer test
